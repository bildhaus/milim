# Runs the Windows WebView2 suites that are too slow for every pull request,
# plus a macOS debug build and /control/v1 smoke of the real desktop binary.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-windows-webview:
    name: Desktop Windows WebView2 E2E and perf
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm -C apps/desktop install --frozen-lockfile
      - run: pnpm -C apps/desktop verify:tauri
      - name: WebView2 E2E suite
        run: pnpm -C apps/desktop test:tauri-webview
      - name: Worker preview tab E2E
        run: pnpm -C apps/desktop test:tauri-worker-preview
      - name: Enforced canonical perf suite
        if: ${{ !cancelled() }}
        run: pnpm -C apps/desktop perf:suite:enforce
        env:
          MILIM_PERF_ARTIFACT_DIR: ${{ github.workspace }}/apps/desktop/tester-artifacts/nightly-perf
      - name: Upload perf evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: nightly-perf-windows
          path: apps/desktop/tester-artifacts/nightly-perf
          if-no-files-found: warn

  # WKWebView has no WebDriver or CDP endpoint, and the desktop API token is
  # random per launch and handed only to the webview. Debug builds therefore
  # write `{api_url, token}` to MILIM_E2E_CONTROL_FILE (0600, removed on exit;
  # compiled out of release builds), so this job launches the real debug
  # binary and runs the /control/v1 smoke in evals/smoke.mjs against it.
  desktop-macos-launch:
    name: Desktop macOS debug build and control smoke
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm -C apps/desktop install --frozen-lockfile
      - name: Debug desktop build
        run: pnpm -C apps/desktop verify:tauri
      - name: Launch the debug binary and run the control smoke
        shell: bash
        run: |
          binary=apps/desktop/src-tauri/target/tauri-verify/debug/milim-desktop
          test -x "$binary"
          export MILIM_HOME="$(mktemp -d)"
          e2e_dir="$(mktemp -d)"
          chmod 700 "$e2e_dir"
          export MILIM_E2E_CONTROL_FILE="$e2e_dir/control.json"
          log="$RUNNER_TEMP/milim-desktop.log"
          RUST_BACKTRACE=1 "$binary" >"$log" 2>&1 &
          pid=$!
          status=0
          MILIM_SMOKE_TIMEOUT_MS=60000 node evals/smoke.mjs || status=$?
          if [ "$status" = 0 ]; then
            api_url="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.env.MILIM_E2E_CONTROL_FILE, "utf8")).api_url)')"
            curl -fsS "$api_url/health" >/dev/null || status=1
          fi
          kill "$pid" 2>/dev/null || true
          for _ in $(seq 1 20); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.5
          done
          kill -9 "$pid" 2>/dev/null || true
          rm -rf "$MILIM_HOME" "$e2e_dir"
          if [ "$status" != 0 ]; then
            cat "$log"
            exit 1
          fi
          echo "macOS debug binary passed the control smoke"
