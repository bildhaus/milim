# Runs the Windows WebView2 suites that are too slow for every pull request.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-windows-webview:
    name: Desktop Windows WebView2 E2E and perf
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm -C apps/desktop install --frozen-lockfile
      - run: pnpm -C apps/desktop verify:tauri
      - name: WebView2 E2E suite
        run: pnpm -C apps/desktop test:tauri-webview
      - name: Worker preview tab E2E
        run: pnpm -C apps/desktop test:tauri-worker-preview
      - name: Enforced canonical perf suite
        if: ${{ !cancelled() }}
        run: pnpm -C apps/desktop perf:suite:enforce
        env:
          MILIM_PERF_ARTIFACT_DIR: ${{ github.workspace }}/apps/desktop/tester-artifacts/nightly-perf
      - name: Upload perf evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: nightly-perf-windows
          path: apps/desktop/tester-artifacts/nightly-perf
          if-no-files-found: warn
