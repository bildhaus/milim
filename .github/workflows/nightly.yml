# Runs the Windows WebView2 suites that are too slow for every pull request,
# plus a macOS debug build and /control/v1 smoke of the real desktop binary,
# and, when a provider key is configured, a small agent-eval subset on it.
name: Desktop integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-windows-webview:
    name: Desktop Windows WebView2 E2E and perf
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm -C apps/desktop install --frozen-lockfile
      - run: pnpm -C apps/desktop verify:tauri
        id: build
      - name: WebView2 E2E suite
        run: pnpm -C apps/desktop test:tauri-webview
      - name: Worker preview tab E2E
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm -C apps/desktop test:tauri-worker-preview
      - name: Canonical perf suite (report budgets on hosted runners)
        if: ${{ !cancelled() }}
        run: pnpm -C apps/desktop perf:suite
        env:
          MILIM_PERF_ARTIFACT_DIR: ${{ github.workspace }}/apps/desktop/tester-artifacts/nightly-perf
      - name: Upload perf evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: nightly-perf-windows
          path: apps/desktop/tester-artifacts/nightly-perf
          if-no-files-found: warn

  # WKWebView has no WebDriver or CDP endpoint, and the desktop API token is
  # random per launch and handed only to the webview. Debug builds therefore
  # write `{api_url, token}` to MILIM_E2E_CONTROL_FILE (0600, removed on exit;
  # compiled out of release builds), so this job launches the real debug
  # binary and runs the /control/v1 smoke in evals/smoke.mjs against it.
  desktop-macos-launch:
    name: Desktop macOS debug build and control smoke
    runs-on: macos-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm -C apps/desktop install --frozen-lockfile
      - name: Debug desktop build
        run: pnpm -C apps/desktop verify:tauri
      - name: Launch the debug binary and run the control smoke
        shell: bash
        run: |
          binary=apps/desktop/src-tauri/target/tauri-verify/debug/milim-desktop
          test -x "$binary"
          export MILIM_HOME="$(mktemp -d)"
          e2e_dir="$(mktemp -d)"
          chmod 700 "$e2e_dir"
          export MILIM_E2E_CONTROL_FILE="$e2e_dir/control.json"
          log="$RUNNER_TEMP/milim-desktop.log"
          RUST_BACKTRACE=1 "$binary" >"$log" 2>&1 &
          pid=$!
          status=0
          MILIM_SMOKE_TIMEOUT_MS=60000 node evals/smoke.mjs || status=$?
          if [ "$status" = 0 ]; then
            api_url="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.env.MILIM_E2E_CONTROL_FILE, "utf8")).api_url)')"
            curl -fsS "$api_url/health" >/dev/null || status=1
          fi
          kill "$pid" 2>/dev/null || true
          for _ in $(seq 1 20); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.5
          done
          kill -9 "$pid" 2>/dev/null || true
          rm -rf "$MILIM_HOME" "$e2e_dir"
          if [ "$status" != 0 ]; then
            cat "$log"
            exit 1
          fi
          echo "macOS debug binary passed the control smoke"
      # Agent evals (evals/README.md) on a small, cheap task subset, against
      # a fresh launch of the same real Tauri debug binary. They run only when
      # the MILIM_EVAL_PROVIDER_KEY secret and MILIM_EVAL_MODEL variable are
      # set. The app gets the key through its OpenAI-compatible fallback
      # backend (MILIM_REMOTE_BASE_URL / MILIM_REMOTE_API_KEY), which
      # model-run shell commands never inherit; the runner never sees it.
      - name: Agent evals (nightly subset)
        id: evals
        shell: bash
        timeout-minutes: 45
        env:
          MILIM_EVAL_PROVIDER_KEY: ${{ secrets.MILIM_EVAL_PROVIDER_KEY }}
          MILIM_EVAL_MODEL: ${{ vars.MILIM_EVAL_MODEL }}
          EVAL_PROVIDER_BASE_URL: ${{ vars.MILIM_EVAL_PROVIDER_BASE_URL || 'https://openrouter.ai/api/v1' }}
          MILIM_EVAL_TASKS: ${{ vars.MILIM_EVAL_NIGHTLY_TASKS || 'bugfix-paginate,bugfix-duration,readonly-discount-question,run-tests-inventory' }}
          MILIM_EVAL_ARTIFACT_NAME: eval-results-nightly
        run: |
          if [ -z "$MILIM_EVAL_PROVIDER_KEY" ] || [ -z "$MILIM_EVAL_MODEL" ]; then
            echo "Agent evals skipped: set the MILIM_EVAL_PROVIDER_KEY secret and the MILIM_EVAL_MODEL variable to enable them." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "ran=true" >> "$GITHUB_OUTPUT"
          binary=apps/desktop/src-tauri/target/tauri-verify/debug/milim-desktop
          test -x "$binary"
          export MILIM_HOME="$(mktemp -d)"
          e2e_dir="$(mktemp -d)"
          chmod 700 "$e2e_dir"
          export MILIM_E2E_CONTROL_FILE="$e2e_dir/control.json"
          log="$RUNNER_TEMP/milim-desktop-evals.log"
          env -u MILIM_EVAL_PROVIDER_KEY \
            MILIM_REMOTE_BASE_URL="$EVAL_PROVIDER_BASE_URL" \
            MILIM_REMOTE_API_KEY="$MILIM_EVAL_PROVIDER_KEY" \
            RUST_BACKTRACE=1 "$binary" >"$log" 2>&1 &
          pid=$!
          status=0
          env -u MILIM_EVAL_PROVIDER_KEY MILIM_EVAL_ARCHIVE=1 \
            node evals/run.mjs --out evals/results/nightly.json --fail-on-error || status=$?
          kill "$pid" 2>/dev/null || true
          for _ in $(seq 1 20); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.5
          done
          kill -9 "$pid" 2>/dev/null || true
          rm -rf "$MILIM_HOME" "$e2e_dir"
          if [ "$status" != 0 ]; then
            tail -n 200 "$log"
            exit "$status"
          fi
      - name: Upload eval results
        if: ${{ always() && steps.evals.outputs.ran == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: eval-results-nightly
          path: evals/results/nightly.json
          if-no-files-found: warn
