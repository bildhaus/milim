# Runs the Windows WebView2 suites that are too slow for every pull request,
# plus a macOS debug build and launch check of the real desktop binary.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-windows-webview:
    name: Desktop Windows WebView2 E2E and perf
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm -C apps/desktop install --frozen-lockfile
      - run: pnpm -C apps/desktop verify:tauri
      - name: WebView2 E2E suite
        run: pnpm -C apps/desktop test:tauri-webview
      - name: Worker preview tab E2E
        run: pnpm -C apps/desktop test:tauri-worker-preview
      - name: Enforced canonical perf suite
        if: ${{ !cancelled() }}
        run: pnpm -C apps/desktop perf:suite:enforce
        env:
          MILIM_PERF_ARTIFACT_DIR: ${{ github.workspace }}/apps/desktop/tester-artifacts/nightly-perf
      - name: Upload perf evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: nightly-perf-windows
          path: apps/desktop/tester-artifacts/nightly-perf
          if-no-files-found: warn

  # WKWebView has no WebDriver or CDP endpoint, the desktop API token is
  # random per launch and handed only to the webview, and the mobile control
  # listener binds an ephemeral port that needs an in-app pairing approval.
  # A /control/v1 smoke against the real app therefore needs a test hook, so
  # this job builds the debug app and proves the real binary starts its
  # embedded server. evals/smoke.mjs covers the control API wherever a
  # credential is available.
  desktop-macos-launch:
    name: Desktop macOS debug build and launch
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm -C apps/desktop install --frozen-lockfile
      - name: Debug desktop build
        run: pnpm -C apps/desktop verify:tauri
      - name: Launch the debug binary and wait for its embedded server
        shell: bash
        run: |
          binary=apps/desktop/src-tauri/target/tauri-verify/debug/milim-desktop
          test -x "$binary"
          if nc -z 127.0.0.1 7377; then
            echo "port 7377 is already in use" >&2
            exit 1
          fi
          export MILIM_HOME="$(mktemp -d)"
          log="$RUNNER_TEMP/milim-desktop.log"
          RUST_BACKTRACE=1 "$binary" >"$log" 2>&1 &
          pid=$!
          healthy=0
          for _ in $(seq 1 120); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "desktop binary exited before its server was ready" >&2
              break
            fi
            if curl -fsS http://127.0.0.1:7377/health >/dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 0.5
          done
          kill "$pid" 2>/dev/null || true
          for _ in $(seq 1 20); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.5
          done
          kill -9 "$pid" 2>/dev/null || true
          rm -rf "$MILIM_HOME"
          if [ "$healthy" != 1 ]; then
            cat "$log"
            exit 1
          fi
          echo "macOS debug binary served /health"
