# Runs the Windows WebView2 suites that are too slow for every pull request,
# plus a macOS debug build and /control/v1 smoke of the real desktop binary,
# and, when a provider key is configured, a small agent-eval subset on it.
name: Desktop integration

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_portable_upgrade:
        description: Validate the branch portable against published 0.2.75 without release writes
        required: false
        default: false
        type: boolean
      upgrade_diagnostics_only:
        description: With portable validation enabled, inspect the runner without launching the app
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-windows-upgrade:
    name: ${{ inputs.upgrade_diagnostics_only && 'Windows WebView2 runner diagnostics' || 'Windows portable upgrade validation' }}
    if: github.event_name == 'workflow_dispatch' && inputs.verify_portable_upgrade
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Record WebView2 runner metadata
        shell: pwsh
        run: |
          $groups = & "$env:WINDIR\System32\whoami.exe" /groups /fo csv /nh
          if ($LASTEXITCODE -ne 0) { throw "Could not read process integrity metadata." }
          $integritySids = @([regex]::Matches(($groups -join "`n"), 'S-1-16-\d+') | ForEach-Object { $_.Value } | Sort-Object -Unique)
          if ($integritySids.Count -ne 1) { throw "Expected one process integrity SID." }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $roots = @(
            @{ scope = "machine-x86"; path = "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application" },
            @{ scope = "machine-x64"; path = "$env:ProgramFiles\Microsoft\EdgeWebView\Application" },
            @{ scope = "user"; path = "$env:LOCALAPPDATA\Microsoft\EdgeWebView\Application" }
          )
          $runtimes = @(foreach ($root in $roots) {
            Get-ChildItem -Path (Join-Path $root.path "*\msedgewebview2.exe") -File -ErrorAction SilentlyContinue | ForEach-Object {
              $version = $_.VersionInfo.FileVersion
              if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "Unexpected WebView2 file version." }
              @{ scope = $root.scope; fileVersion = $version }
            }
          })
          if ($runtimes.Count -eq 0) { throw "No installed WebView2 executable version found." }
          $metadata = @{ integritySid = $integritySids[0]; administratorTokenEnabled = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator); webviewRuntimes = $runtimes }
          $output = Join-Path $env:RUNNER_TEMP "milim-webview-diagnostics"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $metadata | ConvertTo-Json -Depth 4 | Set-Content -Path (Join-Path $output "runner.json")
          $metadata | ConvertTo-Json -Depth 4
      - name: Upload WebView2 runner metadata
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-webview-runner-metadata
          path: ${{ runner.temp }}/milim-webview-diagnostics
          if-no-files-found: error
      - uses: actions/checkout@v5
        if: ${{ !inputs.upgrade_diagnostics_only }}
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !inputs.upgrade_diagnostics_only }}
      - uses: pnpm/action-setup@v5
        if: ${{ !inputs.upgrade_diagnostics_only }}
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        if: ${{ !inputs.upgrade_diagnostics_only }}
        with:
          node-version: '22.23.4'
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        if: ${{ !inputs.upgrade_diagnostics_only }}
        with:
          save-if: false
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm -C apps/desktop install --frozen-lockfile
        if: ${{ !inputs.upgrade_diagnostics_only }}
      - name: Build Windows portable binary
        if: ${{ !inputs.upgrade_diagnostics_only }}
        run: pnpm -C apps/desktop tauri build --no-bundle
      - name: Smoke release binary
        if: ${{ !inputs.upgrade_diagnostics_only }}
        working-directory: apps/desktop
        run: node scripts/smoke-release-binary.mjs
      - name: Stage Windows portable artifact
        if: ${{ !inputs.upgrade_diagnostics_only }}
        working-directory: apps/desktop
        run: node scripts/stage-portable-release-artifact.mjs
      - name: Verify Windows upgrade from published 0.2.75
        if: ${{ !inputs.upgrade_diagnostics_only }}
        working-directory: apps/desktop
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $previousDir = Join-Path $env:RUNNER_TEMP "milim-upgrade-previous"
          gh release download v0.2.75 --repo "${{ github.repository }}" --dir $previousDir --pattern milim-windows-x64-portable.exe --pattern milim-windows-x64-portable.exe.sha256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidate = Get-ChildItem -Path "src-tauri/target/release/bundle/portable" -Filter "*.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows upgrade candidate is missing." }
          $env:MILIM_UPGRADE_PREVIOUS_BINARY = Join-Path $previousDir "milim-windows-x64-portable.exe"
          $env:MILIM_UPGRADE_CANDIDATE_BINARY = $candidate.FullName
          $env:MILIM_UPGRADE_FROM_VERSION = "0.2.75"
          $env:MILIM_UPGRADE_TO_VERSION = (Get-Content "../../VERSION" -Raw).Trim()
          $env:MILIM_UPGRADE_ARTIFACT_DIR = Join-Path (Get-Location) "tester-artifacts/portable-upgrade"
          node tests/tauri-upgrade-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows upgrade proof
        if: ${{ always() && !inputs.upgrade_diagnostics_only }}
        uses: actions/upload-artifact@v6
        with:
          name: branch-windows-upgrade-proof
          path: apps/desktop/tester-artifacts/portable-upgrade
          if-no-files-found: error

  desktop-windows-webview:
    name: Desktop Windows WebView2 E2E and perf
    if: github.event_name != 'workflow_dispatch' || !inputs.verify_portable_upgrade
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm -C apps/desktop install --frozen-lockfile
      - run: pnpm -C apps/desktop verify:tauri
        id: build
      - name: WebView2 E2E suite
        run: pnpm -C apps/desktop test:tauri-webview
      - name: Worker preview tab E2E
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm -C apps/desktop test:tauri-worker-preview
      - name: Canonical perf suite (report budgets on hosted runners)
        if: ${{ !cancelled() }}
        run: pnpm -C apps/desktop perf:suite
        env:
          MILIM_PERF_ARTIFACT_DIR: ${{ github.workspace }}/apps/desktop/tester-artifacts/nightly-perf
      - name: Upload perf evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: nightly-perf-windows
          path: apps/desktop/tester-artifacts/nightly-perf
          if-no-files-found: warn

  # WKWebView has no WebDriver or CDP endpoint, and the desktop API token is
  # random per launch and handed only to the webview. Debug builds therefore
  # write `{api_url, token}` to MILIM_E2E_CONTROL_FILE (0600, removed on exit;
  # compiled out of release builds), so this job launches the real debug
  # binary and runs the /control/v1 smoke in evals/smoke.mjs against it.
  desktop-macos-launch:
    name: Desktop macOS debug build and control smoke
    if: github.event_name != 'workflow_dispatch' || !inputs.verify_portable_upgrade
    runs-on: macos-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm -C apps/desktop install --frozen-lockfile
      - name: Debug desktop build
        run: pnpm -C apps/desktop verify:tauri
      - name: Launch the debug binary and run the control smoke
        shell: bash
        run: |
          binary=apps/desktop/src-tauri/target/tauri-verify/debug/milim-desktop
          test -x "$binary"
          export MILIM_HOME="$(mktemp -d)"
          e2e_dir="$(mktemp -d)"
          chmod 700 "$e2e_dir"
          export MILIM_E2E_CONTROL_FILE="$e2e_dir/control.json"
          log="$RUNNER_TEMP/milim-desktop.log"
          RUST_BACKTRACE=1 "$binary" >"$log" 2>&1 &
          pid=$!
          status=0
          MILIM_SMOKE_TIMEOUT_MS=60000 node evals/smoke.mjs || status=$?
          if [ "$status" = 0 ]; then
            api_url="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.env.MILIM_E2E_CONTROL_FILE, "utf8")).api_url)')"
            curl -fsS "$api_url/health" >/dev/null || status=1
          fi
          kill "$pid" 2>/dev/null || true
          for _ in $(seq 1 20); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.5
          done
          kill -9 "$pid" 2>/dev/null || true
          rm -rf "$MILIM_HOME" "$e2e_dir"
          if [ "$status" != 0 ]; then
            cat "$log"
            exit 1
          fi
          echo "macOS debug binary passed the control smoke"
      # Agent evals (evals/README.md) on a small, cheap task subset, against
      # a fresh launch of the same real Tauri debug binary. They run only when
      # the MILIM_EVAL_PROVIDER_KEY secret and MILIM_EVAL_MODEL variable are
      # set. The app gets the key through its OpenAI-compatible fallback
      # backend (MILIM_REMOTE_BASE_URL / MILIM_REMOTE_API_KEY), which
      # model-run shell commands never inherit; the runner never sees it.
      - name: Agent evals (nightly subset)
        id: evals
        shell: bash
        timeout-minutes: 45
        env:
          MILIM_EVAL_PROVIDER_KEY: ${{ secrets.MILIM_EVAL_PROVIDER_KEY }}
          MILIM_EVAL_MODEL: ${{ vars.MILIM_EVAL_MODEL }}
          EVAL_PROVIDER_BASE_URL: ${{ vars.MILIM_EVAL_PROVIDER_BASE_URL || 'https://openrouter.ai/api/v1' }}
          MILIM_EVAL_TASKS: ${{ vars.MILIM_EVAL_NIGHTLY_TASKS || 'bugfix-paginate,bugfix-duration,readonly-discount-question,run-tests-inventory' }}
          MILIM_EVAL_ARTIFACT_NAME: eval-results-nightly
        run: |
          if [ -z "$MILIM_EVAL_PROVIDER_KEY" ] || [ -z "$MILIM_EVAL_MODEL" ]; then
            echo "Agent evals skipped: set the MILIM_EVAL_PROVIDER_KEY secret and the MILIM_EVAL_MODEL variable to enable them." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "ran=true" >> "$GITHUB_OUTPUT"
          binary=apps/desktop/src-tauri/target/tauri-verify/debug/milim-desktop
          test -x "$binary"
          export MILIM_HOME="$(mktemp -d)"
          e2e_dir="$(mktemp -d)"
          chmod 700 "$e2e_dir"
          export MILIM_E2E_CONTROL_FILE="$e2e_dir/control.json"
          log="$RUNNER_TEMP/milim-desktop-evals.log"
          env -u MILIM_EVAL_PROVIDER_KEY \
            MILIM_REMOTE_BASE_URL="$EVAL_PROVIDER_BASE_URL" \
            MILIM_REMOTE_API_KEY="$MILIM_EVAL_PROVIDER_KEY" \
            RUST_BACKTRACE=1 "$binary" >"$log" 2>&1 &
          pid=$!
          status=0
          env -u MILIM_EVAL_PROVIDER_KEY MILIM_EVAL_ARCHIVE=1 \
            node evals/run.mjs --out evals/results/nightly.json --fail-on-error || status=$?
          kill "$pid" 2>/dev/null || true
          for _ in $(seq 1 20); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.5
          done
          kill -9 "$pid" 2>/dev/null || true
          rm -rf "$MILIM_HOME" "$e2e_dir"
          if [ "$status" != 0 ]; then
            tail -n 200 "$log"
            exit "$status"
          fi
      - name: Upload eval results
        if: ${{ always() && steps.evals.outputs.ran == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: eval-results-nightly
          path: evals/results/nightly.json
          if-no-files-found: warn
