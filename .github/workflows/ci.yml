name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Generated control contract
        if: matrix.os == 'ubuntu-latest'
        run: cargo run --manifest-path Cargo.toml -p milim-control-contract --bin generate-control-contract -- --check
      - name: Tauri native credential backend
        if: matrix.os != 'ubuntu-latest'
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --no-default-features

  msrv:
    name: Rust MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read declared rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace on declared rust-version
        run: cargo check --workspace --all-targets --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    env:
      CARGO_AUDIT_VERSION: 0.22.2
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo-audit
        id: cargo-audit-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}
      - name: Install cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"
      # Vulnerabilities fail the job; unmaintained, unsound, and yanked
      # advisories are printed as warnings only.
      - name: Audit root Cargo.lock
        run: cargo audit --file Cargo.lock
      - name: Audit Tauri Cargo.lock
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock
      - name: Shared milim-* dependency versions match across lockfiles
        run: node apps/desktop/scripts/verify-lockfile-drift.mjs

  frontend:
    name: Desktop frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Linux webview deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm
      - run: pnpm -C apps/desktop install --frozen-lockfile
      - name: Tauri Rust clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Tauri Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: pnpm -C apps/desktop verify:frontend

  desktop-windows-runtime:
    name: Desktop Windows close-to-tray
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm -C apps/desktop install --frozen-lockfile
      - run: pnpm -C apps/desktop verify:tauri
      - run: pnpm -C apps/desktop test:tauri-window-close

  mobile-android:
    name: Mobile Android debug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: pnpm -C apps/mobile install --frozen-lockfile
      - run: pnpm -C apps/mobile verify
      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

  mobile-ios:
    name: Mobile iOS simulator
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - run: pnpm -C apps/mobile install --frozen-lockfile
      - name: Install CocoaPods
        working-directory: apps/mobile
        run: bundle install --jobs 4 --retry 3
      - name: Install iOS pods
        working-directory: apps/mobile
        run: bundle exec pod install --project-directory=ios
      - name: Build iOS simulator app
        working-directory: apps/mobile
        run: >-
          xcodebuild
          -workspace ios/MilimMobile.xcworkspace
          -scheme MilimMobile
          -configuration Debug
          -sdk iphonesimulator
          -derivedDataPath ios/build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build
