name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Generated control contract
        if: matrix.os == 'ubuntu-latest'
        run: cargo run --manifest-path Cargo.toml -p milim-control-contract --bin generate-control-contract -- --check
      - name: Tauri native credential backend
        if: matrix.os != 'ubuntu-latest'
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --no-default-features

  frontend:
    name: Desktop frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: pnpm/action-setup@v5
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Linux webview deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm
      - run: pnpm -C apps/desktop install --frozen-lockfile
      - name: Tauri Rust clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Tauri Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: pnpm -C apps/desktop verify:frontend

  mobile-android:
    name: Mobile Android debug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: pnpm -C apps/mobile install --frozen-lockfile
      - run: pnpm -C apps/mobile verify
      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

  mobile-ios:
    name: Mobile iOS simulator
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - run: pnpm -C apps/mobile install --frozen-lockfile
      - name: Install CocoaPods
        working-directory: apps/mobile
        run: bundle install --jobs 4 --retry 3
      - name: Install iOS pods
        working-directory: apps/mobile
        run: bundle exec pod install --project-directory=ios
      - name: Build iOS simulator app
        working-directory: apps/mobile
        run: >-
          xcodebuild
          -workspace ios/MilimMobile.xcworkspace
          -scheme MilimMobile
          -configuration Debug
          -sdk iphonesimulator
          -derivedDataPath ios/build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build
