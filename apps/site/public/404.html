<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark light" />
    <title>Page not found - milim</title>
    <link rel="icon" href="/assets/icon.png" type="image/png" />
    <style>
      @font-face {
        font-family: Geist;
        src: url("/assets/fonts/Geist-400.woff2") format("woff2");
        font-display: swap;
      }

      @font-face {
        font-family: Geist;
        src: url("/assets/fonts/Geist-800.woff2") format("woff2");
        font-weight: 800;
        font-display: swap;
      }

      :root {
        color-scheme: dark light;
        font-family: Geist, system-ui, sans-serif;
        color: #f7f7f3;
        background: #030303;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
        background:
          linear-gradient(135deg, rgba(155, 183, 196, 0.1), transparent 45%),
          #030303;
      }

      main {
        width: min(680px, calc(100% - 44px));
      }

      img {
        width: 54px;
        filter: invert(1);
      }

      p {
        max-width: 54ch;
        color: #bebeb8;
        font-size: 1.05rem;
        line-height: 1.6;
      }

      .code {
        margin: 42px 0 12px;
        color: #9bb7c4;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
        text-transform: uppercase;
      }

      h1 {
        max-width: 620px;
        margin: 0;
        font-size: clamp(3.4rem, 10vw, 7.5rem);
        font-weight: 800;
        line-height: 0.88;
        letter-spacing: -0.055em;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 34px;
      }

      a {
        padding: 11px 15px;
        border: 1px solid rgba(247, 247, 243, 0.18);
        border-radius: 6px;
        color: inherit;
        text-decoration: none;
      }

      a:first-child {
        color: #050506;
        background: #f3f2ed;
      }

      a:focus-visible {
        outline: 2px solid #f3f2ed;
        outline-offset: 4px;
      }

      @media (prefers-color-scheme: light) {
        :root {
          color: #10100f;
          background: #f1eee7;
        }

        body {
          background:
            linear-gradient(135deg, rgba(84, 115, 130, 0.1), transparent 45%),
            #f1eee7;
        }

        img {
          filter: none;
        }

        p {
          color: #5f5b52;
        }

        a {
          border-color: rgba(16, 16, 15, 0.22);
        }

        a:first-child {
          color: #f6f2ea;
          background: #10100f;
        }

        a:focus-visible {
          outline-color: #10100f;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/milim-wordmark.svg" alt="milim" />
      <p class="code">404 / route not found</p>
      <h1>This thread went nowhere.</h1>
      <p>The page may have moved, or the address may be wrong. Return to milim or continue in the documentation.</p>
      <nav aria-label="Recovery">
        <a href="https://milim.ai/">milim home</a>
        <a href="https://docs.milim.ai/">documentation</a>
        <a href="https://github.com/bildhaus/milim">GitHub</a>
      </nav>
    </main>
  </body>
</html>
